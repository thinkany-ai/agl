[package]
name = "agl"
version = "0.3.19"
edition = "2021"
description = "AgentLink: drive local coding agents (Claude Code, Codex) from the CLI or a remote web app"
license = "MIT"
repository = "https://github.com/thinkany-ai/agl"
homepage = "https://github.com/thinkany-ai/agl"
readme = "README.md"
keywords = ["agent", "claude-code", "codex", "acp", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream"] }

# The computer-use helper's on-screen indicator and outline (computer/ui.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSLocale", "NSObject", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSRunningApplication", "NSPanel", "NSWindow",
  "NSView", "NSControl", "NSTextField", "NSButton", "NSColor", "NSFont", "NSScreen", "NSGraphics", "NSParagraphStyle", "NSText",
] }
dispatch2 = "0.3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
